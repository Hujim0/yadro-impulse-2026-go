name: Go Test CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Install raylib dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt ./...
      - name: Verify coverage
        run: go tool cover -func=coverage.txt
